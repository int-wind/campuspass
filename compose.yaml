name: campuspass
services:
  mysql:
    image: mysql:8.0.41
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-authentication-plugin=mysql_native_password", "--default-time-zone=+08:00"]
    environment:
      MYSQL_DATABASE: campuspass
      MYSQL_USER: campuspass
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-campuspass-local-only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-local-only}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - campuspass_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3G
  redis:
    image: redis:7.2.7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - campuspass_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
  rabbitmq:
    image: rabbitmq:4.1.0-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-campuspass}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-campuspass-local-only}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - campuspass_rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G
volumes:
  campuspass_mysql:
  campuspass_redis:
  campuspass_rabbitmq:
